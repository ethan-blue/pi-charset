name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node tools/check-release.mjs --tag ${{ github.ref_name }}
      - run: npm run typecheck
      - run: npm test

  npm-publish:
    needs: verify
    if: vars.ENABLE_NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Ensure npm supports OIDC Trusted Publishing
        run: |
          npm --version
          node -e 'const [maj,min]=process.argv[1].split(".").map(Number); process.exit(maj>11||(maj===11&&min>=6)?0:1)' "$(npm --version)" || npm install -g npm@^11.6.0

      - run: npm ci
      - run: npm publish --provenance --access public

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build tarball and release notes
        run: |
          node tools/extract-changelog.mjs "${{ github.ref_name }}" > release-notes.md
          npm pack

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --latest
            gh release upload "$TAG" pi-charset-*.tgz --clobber
          else
            gh release create "$TAG" pi-charset-*.tgz --title "$TAG" --notes-file release-notes.md --verify-tag --latest
          fi
